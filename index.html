<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gastos">
<title>Mis Gastos</title>
<style>
  :root {
    color-scheme: light;
    --bg: #EEF0E7;
    --card: #FBFBF7;
    --ink: #1C231F;
    --muted: #6B7268;
    --line: #DEDFD3;
    --emerald: #1F6F54;
    --emerald-deep: #14503C;
    --gold: #B98A2E;
    --coral: #B5473A;
    --tag-shaun: #2F8F6B;
    --tag-swift: #B98A2E;
    --tag-salidas: #B5473A;
    --tag-gp: #46626F;
    --tag-hogar: #8A6A4E;
    --pago-breb: #6B4FA0;
    --pago-tarjeta: #E8590C;
    --pago-efectivo: #2E7D8C;
    --shadow: 0 8px 24px rgba(20, 30, 24, 0.10);
  }
  .rounded { font-family: ui-rounded, -apple-system, BlinkMacSystemFont, sans-serif; }

  html, body { height: 100%; }
  html { overscroll-behavior-y: none; }
  body {
    font-family: -apple-system, sans-serif; margin: 0; padding: 16px;
    max-width: 480px; margin-inline: auto; background: var(--bg); color: var(--ink);
    box-sizing: border-box; overscroll-behavior-y: none;
    display: flex; flex-direction: column; min-height: 100%;
  }

  #mesNav { display: flex; align-items: center; justify-content: center; gap: 10px; }
  #filtroActivo { display: flex; justify-content: center; min-height: 0; }
  #filtroActivo:not(:empty) { margin: 6px 0 2px; }
  .pastilla-filtro {
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 4px 12px; font-size: 0.78rem; font-weight: 600;
  }
  .pastilla-filtro:active { transform: scale(0.96); }
  #mesNav button {
    background: none; border: none; color: var(--gold); font-size: 1.9rem; line-height: 1;
    padding: 4px 8px; font-family: Georgia, serif;
  }
  #mesNav button:disabled { opacity: 0.25; }
  #mesNav button:active:not(:disabled) { transform: scale(0.88); }
  #mesHeader {
    text-align: center; font-family: 'Snell Roundhand', 'Bradley Hand', cursive, ui-rounded, -apple-system, sans-serif;
    font-size: 2.1rem; font-weight: 600; letter-spacing: 0.01em; margin: 4px 0 6px;
  }
  #mesHeader::after { content: ''; display: block; width: 48px; height: 2px; background: var(--gold); margin: 6px auto 0; border-radius: 2px; }

  #resumen { padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; margin-top: 14px; background: var(--card); box-shadow: var(--shadow); }
  .resumen-total-mes { font-size: 1.3rem; font-weight: 700; margin-bottom: 10px; }
  .resumen-filas { display: flex; flex-direction: column; gap: 6px; }
  .resumen-fila { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; cursor: pointer; }
  .resumen-fila:active { opacity: 0.65; }
  .resumen-fila .barra { width: 5px; height: 16px; border-radius: 3px; flex-shrink: 0; }
  .resumen-fila .nombre { flex: 1; color: var(--ink); }
  .resumen-fila .monto { color: var(--muted); font-variant-numeric: tabular-nums; }
  .cambio-mes { margin-left: 8px; font-size: 0.78rem; font-weight: 600; vertical-align: middle; }
  .cambio-mes.sube { color: var(--coral); }
  .cambio-mes.baja { color: var(--emerald); }
  .cambio-mes.neutro { color: var(--muted); }
  .barra-shaun { background: var(--tag-shaun); }
  .barra-swift { background: var(--tag-swift); }
  .barra-salidas { background: var(--tag-salidas); }
  .barra-gp { background: var(--tag-gp); }
  .barra-hogar { background: var(--tag-hogar); }
  .barra-breb { background: var(--pago-breb); }
  .barra-tarjeta { background: var(--pago-tarjeta); }
  .barra-efectivo { background: var(--pago-efectivo); }
  .pastilla-breb { border-color: var(--pago-breb); color: var(--pago-breb); }
  .pastilla-tarjeta { border-color: var(--pago-tarjeta); color: var(--pago-tarjeta); }
  .pastilla-efectivo { border-color: var(--pago-efectivo); color: var(--pago-efectivo); }
  .resumen-separador { border-top: 1px solid var(--line); margin: 12px 0 8px; }

  #controles { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; }
  #controles button { padding: 12px 14px; font-size: 1rem; }
  #controles button:disabled { opacity: 0.3; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .chip {
    padding: 10px 16px; border: 1.5px solid var(--line); border-radius: 999px;
    background: var(--card); color: var(--ink); font-weight: 600; font-size: 0.92rem;
    transition: transform .15s ease, background .15s ease, border-color .15s ease, color .15s ease, box-shadow .15s ease;
  }
  .chip:active { transform: scale(0.96); }
  .chip.selected { border-color: var(--emerald); background: var(--emerald); color: #fff; box-shadow: 0 3px 10px rgba(31,111,84,0.35); transform: rotate(-2deg); }
  .chip.selected:nth-child(even) { transform: rotate(2deg); }
  .grupo-titulo { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 10px 0 6px; }
  .chip-shaun { border-color: var(--tag-shaun); color: var(--tag-shaun); }
  .chip-swift { border-color: var(--tag-swift); color: var(--tag-swift); }
  .chip-salidas { border-color: var(--tag-salidas); color: var(--tag-salidas); }
  .chip-gp { border-color: var(--tag-gp); color: var(--tag-gp); }
  .chip-hogar { border-color: var(--tag-hogar); color: var(--tag-hogar); }
  .chip-cat.selected.chip-shaun { background: var(--tag-shaun); color: #fff; border-color: transparent; }
  .chip-cat.selected.chip-swift { background: var(--tag-swift); color: #fff; border-color: transparent; }
  .chip-cat.selected.chip-salidas { background: var(--tag-salidas); color: #fff; border-color: transparent; }
  .chip-cat.selected.chip-gp { background: var(--tag-gp); color: #fff; border-color: transparent; }
  .chip-cat.selected.chip-hogar { background: var(--tag-hogar); color: #fff; border-color: transparent; }
  .chip-breb { border-color: var(--pago-breb); color: var(--pago-breb); }
  .chip-tarjeta { border-color: var(--pago-tarjeta); color: var(--pago-tarjeta); }
  .chip-efectivo { border-color: var(--pago-efectivo); color: var(--pago-efectivo); }
  .chip-pago.selected.chip-breb { background: var(--pago-breb); color: #fff; border-color: transparent; }
  .chip-pago.selected.chip-tarjeta { background: var(--pago-tarjeta); color: #fff; border-color: transparent; }
  .chip-pago.selected.chip-efectivo { background: var(--pago-efectivo); color: #fff; border-color: transparent; }

  #monto { font-size: 1.4rem; width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); }
  #nota { font-size: 0.95rem; width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); font-family: inherit; }
  .recibo-preview { margin: 14px 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); min-height: 60px; }
  .recibo-preview pre { margin: 0; font-family: 'Courier New', monospace; font-size: 1.05rem; color: var(--ink); white-space: pre-wrap; word-break: break-word; }
  .linea-recibo { min-height: 1.4em; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .deshacer-linea {
    flex-shrink: 0; width: 20px; height: 20px; margin-top: 1px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--card); color: var(--muted);
    font-size: 0.85rem; line-height: 1; padding: 0;
  }
  .deshacer-linea:active { background: var(--line); }

  #guardarBtn {
    width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 12px;
    background: linear-gradient(180deg, var(--emerald) 0%, var(--emerald-deep) 100%);
    color: #fff; font-weight: 700; font-size: 1rem;
    letter-spacing: 0.04em; text-transform: uppercase;
    box-shadow: 0 4px 14px rgba(31,111,84,0.35), inset 0 1px 0 rgba(255,255,255,0.15);
    transition: transform .15s ease, opacity .15s ease, box-shadow .15s ease;
  }
  #guardarBtn:active:not(:disabled) { transform: scale(0.98); }
  #guardarBtn:disabled { opacity: 0.4; background: var(--muted); box-shadow: none; }

  .masthead { font-weight: bold; letter-spacing: 0.08em; text-transform: uppercase; padding-bottom: 8px; margin-bottom: 10px; border-bottom: 1px dashed var(--line); }
  .content { font-family: 'Courier New', monospace; }
  .monto-grande { font-size: 2.9rem; font-weight: 700; margin: 8px 0 14px; }
  .detalle-secundario { color: var(--muted); font-size: 1.6rem; margin: 2px 0; }
  .nota-gasto { font-style: italic; }
  .fecha-gasto { font-size: 1.2rem; margin-top: 6px; }
  .portada { height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .portada .masthead { font-size: 1.3rem; border-bottom: none; padding-bottom: 0; }
  .portada .content { font-size: 1.6rem; margin-top: 10px; }

  .badge { display: inline-flex; align-items: center; justify-content: center; min-width: 40px; height: 32px; padding: 0 6px; border-radius: 7px; color: #fff; font-weight: bold; font-size: 0.95rem; letter-spacing: 0.02em; margin-right: 10px; vertical-align: middle; }
  .badge-shaun { background: var(--tag-shaun); }
  .badge-swift { background: var(--tag-swift); }
  .badge-salidas { background: var(--tag-salidas); }
  .badge-gp { background: var(--tag-gp); }
  .badge-hogar { background: var(--tag-hogar); }
  .hoja-escrita {
    border-left: 5px solid transparent; margin: -18px -18px -18px -13px; padding: 20px 20px 20px 15px;
    box-sizing: border-box; min-height: calc(100% + 36px);
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .hoja-escrita.borde-shaun { border-left-color: var(--tag-shaun); }
  .hoja-escrita.borde-swift { border-left-color: var(--tag-swift); }
  .hoja-escrita.borde-salidas { border-left-color: var(--tag-salidas); }
  .hoja-escrita.borde-gp { border-left-color: var(--tag-gp); }
  .hoja-escrita.borde-hogar { border-left-color: var(--tag-hogar); }

  #notebook {
    position: relative; width: 100%;
    height: var(--alto-notebook, 220px);
    transition: height .25s ease;
    touch-action: none;
  }
  #notebook.mes-saliendo, #notebook.mes-entrando, #notebook.mes-mostrar { transition: transform .26s ease, opacity .26s ease; }
  #notebook.mes-saliendo.izq { opacity: 0; transform: translateX(-18px); }
  #notebook.mes-saliendo.der { opacity: 0; transform: translateX(18px); }
  #notebook.mes-entrando { transition: none !important; }
  #notebook.mes-entrando.izq { opacity: 0; transform: translateX(18px); }
  #notebook.mes-entrando.der { opacity: 0; transform: translateX(-18px); }
  #notebook.mes-mostrar { opacity: 1; transform: translateX(0); }
  @media (prefers-reduced-motion: reduce) {
    #notebook.mes-saliendo, #notebook.mes-entrando, #notebook.mes-mostrar { transition: none !important; transform: none !important; opacity: 1 !important; }
  }

  .pagina-cara, .leaf { position: absolute; inset: 0; border-radius: 6px; }
  .pagina-cara {
    background-color: var(--card);
    background-image:
      radial-gradient(circle at 20% 30%, rgba(0,0,0,0.015) 0, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0,0,0,0.015) 0, transparent 40%),
      radial-gradient(circle at 50% 90%, rgba(0,0,0,0.012) 0, transparent 45%);
    border: 1px solid var(--line); padding: 18px; box-sizing: border-box; box-shadow: var(--shadow); overflow: auto;
  }
  .pagina-cara.pila { pointer-events: none; }
  .pagina-cara.pila-1 { transform: rotate(-1.5deg) translate(-3px, 2px); z-index: 0; }
  .pagina-cara.pila-2 { transform: rotate(1.5deg) translate(3px, 4px); z-index: 0; }
  #pageUnder { z-index: 1; }
  .leaf { z-index: 2; will-change: transform, opacity; }
  .stamp { position: absolute; top: 40%; left: 50%; width: 150px; padding: 6px 0; border: 3px solid var(--coral); color: var(--coral); font-weight: bold; text-align: center; letter-spacing: .1em; transform: translate(-50%,-50%) rotate(-14deg) scale(1); opacity: 0; pointer-events: none; z-index: 10; }
  .stamp.show { animation: stampPop .9s ease forwards; }
  @keyframes stampPop { 0%{opacity:0; transform:translate(-50%,-50%) rotate(-14deg) scale(2.2);} 30%{opacity:1; transform:translate(-50%,-50%) rotate(-14deg) scale(1);} 75%{opacity:1;} 100%{opacity:0; transform:translate(-50%,-50%) rotate(-14deg) scale(1);} }
  .leaf.saliendo-arriba { animation: saleArriba .2s cubic-bezier(.4,0,.2,1) forwards; }
  .leaf.saliendo-abajo { animation: saleAbajo .2s cubic-bezier(.4,0,.2,1) forwards; }
  @keyframes saleArriba {
    0%   { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
    100% { transform: translateY(-115%) rotate(-3deg) scale(0.92); opacity: 0; }
  }
  @keyframes saleAbajo {
    0%   { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
    100% { transform: translateY(115%) rotate(3deg) scale(0.92); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .leaf.saliendo-arriba, .leaf.saliendo-abajo { animation: none; }
    .stamp.show { animation: stampFade .9s ease forwards; }
  }
  @keyframes stampFade { 0%{opacity:0;} 20%{opacity:1;} 80%{opacity:1;} 100%{opacity:0;} }
  .leaf.rebote { animation: rebote .25s ease; }
  #notebook.rebote { animation: rebote .25s ease; }
  @keyframes rebote { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }

  #medidor {
    position: absolute; visibility: hidden; pointer-events: none; top: -9999px; left: 0;
    box-sizing: border-box; border: 1px solid var(--line); padding: 18px; border-radius: 6px;
  }

  .anular { align-self: flex-end; background: none; border: 1px solid var(--coral); color: var(--coral); border-radius: 8px; padding: 4px 8px; font-weight: 700; font-size: 0.7rem; margin-top: 10px; }
  .anular:active { transform: scale(0.97); }
</style>
</head>
<body>
  <div id="mesNav">
    <button id="btnMesAnteriorVisible" aria-label="Mes anterior">‹</button>
    <h1 id="mesHeader"></h1>
    <button id="btnMesSiguienteVisible" aria-label="Mes siguiente">›</button>
  </div>
  <div id="filtroActivo"></div>
  <div id="notebook">
    <div class="pagina-cara pila pila-2" aria-hidden="true"></div>
    <div class="pagina-cara pila pila-1" aria-hidden="true"></div>
    <div id="pageUnder" class="pagina-cara"></div>
    <div id="leaf" class="leaf">
      <div id="faceFront" class="pagina-cara"></div>
    </div>
    <div id="stamp" class="stamp">GUARDADO</div>
  </div>
  <div id="medidor"></div>
  <div id="controles">
    <button id="btnMesAnterior">◀ Mes</button>
    <button id="btnArriba">▲</button>
    <button id="btnAbajo">▼</button>
    <button id="btnMesSiguiente">Mes ▶</button>
  </div>
  <div id="resumen"></div>

<script src="logic.js"></script>
<script>
  const KEY = 'gastos_v1';

  function cargarGastos() { return JSON.parse(localStorage.getItem(KEY) || '[]'); }
  function guardarGastos(gastos) { localStorage.setItem(KEY, JSON.stringify(gastos)); }
  function moneda(n) { return '$' + Math.round(n).toLocaleString('es-CO'); }

  // #monto es texto (no <input type="number">) para poder mostrar el punto
  // de miles mientras se escribe. numeroDesdeMonto() le quita ese punto (y
  // cualquier otro carácter que no sea dígito) para recuperar el número real.
  function numeroDesdeMonto(valor) {
    const soloDigitos = String(valor).replace(/\D/g, '');
    return soloDigitos ? parseFloat(soloDigitos) : NaN;
  }

  function formatearMontoInput(input) {
    const soloDigitos = input.value.replace(/\D/g, '');
    input.value = soloDigitos ? Number(soloDigitos).toLocaleString('es-CO') : '';
  }
  function mesActualKey() { return mesKeyDeFecha(new Date().toISOString()); }

  let estado = { mesIndex: null, posicion: -1, categoriaFiltro: null, pagoFiltro: null, _saltarAlFiltrar: false };

  // Todas las páginas (portada, hoja en blanco, recibos guardados) comparten
  // un único alto de cuaderno en vez de medirse cada una por su cuenta — si no,
  // pasar de la hoja en blanco (la más alta, con todos los campos) a un recibo
  // guardado (mucho más corto) se sentía como una transición rota, con la
  // tarjeta encogiéndose de golpe. `alturaReferencia` solo crece, nunca baja,
  // así que en cuanto se mide la hoja en blanco una vez, esa altura queda
  // fija para el resto de páginas también.
  let alturaReferencia = 0;

  function ajustarAltura(html) {
    const notebook = document.getElementById('notebook');
    const medidor = document.getElementById('medidor');
    medidor.style.width = notebook.clientWidth + 'px';
    medidor.innerHTML = html;
    // El recibo-preview se oculta condicionalmente vía JS en actualizarRecibo()
    // (sobre el nodo real, después de esta medición). Replicamos aquí esa misma
    // condición para que el cuaderno no reserve un hueco vacío mientras la caja
    // está oculta.
    const cajaRecibo = medidor.querySelector('#reciboPreviewBox');
    if (cajaRecibo && !reciboTieneContenido()) cajaRecibo.style.display = 'none';
    const alto = Math.max(medidor.offsetHeight + 110, 160);
    alturaReferencia = Math.max(alturaReferencia, alto);
    notebook.style.setProperty('--alto-notebook', alturaReferencia + 'px');
  }

  function render() {
    const gastos = cargarGastos();
    const gastosPorMes = agruparPorMes(gastos);
    const mesActual = mesActualKey();
    const meses = mesesDisponibles(gastosPorMes, mesActual);

    if (estado.mesIndex === null) estado.mesIndex = meses.indexOf(mesActual);
    estado.mesIndex = clamp(estado.mesIndex, 0, meses.length - 1);

    const mesKey = meses[estado.mesIndex];
    const esMesActual = mesKey === mesActual;
    const gastosDelMes = gastosPorMes[mesKey] || [];
    const resumen = calcularResumenMes(gastosDelMes);
    const paginas = obtenerPaginas(gastosDelMes, esMesActual, estado.categoriaFiltro, estado.pagoFiltro);
    if (estado._saltarAlFiltrar) {
      estado.posicion = paginas.length > 0 ? 0 : -1;
      estado._saltarAlFiltrar = false;
    } else {
      estado.posicion = clamp(estado.posicion, -1, paginas.length - 1);
    }

    const mesAnteriorKey = sumarMeses(mesKey, -1);
    const totalMesAnterior = calcularResumenMes(gastosPorMes[mesAnteriorKey] || []).total;
    const cambio = esMesActual ? null : cambioPorcentual(resumen.total, totalMesAnterior);
    const badgeCambio = cambio === null ? '' :
      cambio === 0 ? `<span class="cambio-mes neutro">= igual que ${nombreMesCorto(mesAnteriorKey)}</span>` :
      cambio > 0 ? `<span class="cambio-mes sube">↑${cambio}% vs ${nombreMesCorto(mesAnteriorKey)}</span>` :
      `<span class="cambio-mes baja">↓${Math.abs(cambio)}% vs ${nombreMesCorto(mesAnteriorKey)}</span>`;

    document.getElementById('mesHeader').textContent = nombreMes(mesKey);
    actualizarFiltroActivo();
    document.getElementById('resumen').innerHTML = `
      <div class="resumen-total-mes rounded">Total del mes: ${moneda(resumen.total)}${badgeCambio}</div>
      <div class="resumen-filas">
        ${CATEGORIAS.map(cat => `
          <div class="resumen-fila" data-categoria="${cat}">
            <span class="barra ${BADGE_CATEGORIA[cat].replace('badge-', 'barra-')}"></span>
            <span class="nombre">${cat}</span>
            <span class="monto">${moneda(resumen.porCategoria[cat])}</span>
          </div>
        `).join('')}
      </div>
      <div class="resumen-separador"></div>
      <div class="resumen-filas">
        ${PAGOS.map(p => `
          <div class="resumen-fila" data-pago="${p}">
            <span class="barra barra-${CLASE_PAGO[p]}"></span>
            <span class="nombre">${p}</span>
            <span class="monto">${moneda(resumen.porPago[p])}</span>
          </div>
        `).join('')}
      </div>
    `;

    const contenidoActual = estado.posicion === -1 ? 'portada' : paginas[estado.posicion];
    const html = htmlDePagina(contenidoActual, mesKey, resumen);

    if (!window._paginaInicial) {
      document.getElementById('faceFront').innerHTML = html;
      document.getElementById('pageUnder').innerHTML = html;
      window._paginaInicial = true;
      // Solo se sincronizan los chips/inputs visibles cuando esta llamada a
      // render() de verdad puso la página nueva en #faceFront. Cuando
      // render() se usa solo para calcular datos.html de la página que va a
      // entrar en la transición (commitCambioPagina, con la página vieja
      // todavía en pantalla), llamar esto aquí tocaba de más la página que
      // se estaba por ir — el propio flujo de la transición ya sincroniza
      // esto cuando la página nueva realmente queda en #faceFront.
      marcarSeleccionActiva();
      actualizarGuardar();
      actualizarRecibo();
    }

    ajustarAltura(html);

    document.getElementById('btnMesAnterior').disabled = estado.mesIndex === 0;
    document.getElementById('btnMesSiguiente').disabled = estado.mesIndex === meses.length - 1;
    document.getElementById('btnMesAnteriorVisible').disabled = estado.mesIndex === 0;
    document.getElementById('btnMesSiguienteVisible').disabled = estado.mesIndex === meses.length - 1;
    document.getElementById('btnArriba').disabled = estado.posicion === -1;
    document.getElementById('btnAbajo').disabled = estado.posicion === paginas.length - 1;

    return { mesKey, esMesActual, gastosDelMes, resumen, paginas, contenidoActual, html };
  }

  const NOMBRES_MES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

  function nombreMes(mesKey) {
    const [anio, mes] = mesKey.split('-').map(Number);
    return `${NOMBRES_MES[mes - 1]} ${anio}`;
  }

  function nombreMesCorto(mesKey) {
    const [, mes] = mesKey.split('-').map(Number);
    return NOMBRES_MES[mes - 1].toLowerCase();
  }

  // PAGOS ya viene declarada como global desde logic.js (mismo patrón que
  // CATEGORIAS) — no se vuelve a declarar aquí para no chocar con un
  // "Identifier 'PAGOS' has already been declared".
  const CLASE_PAGO = { 'BreB': 'breb', 'Tarjeta de Crédito': 'tarjeta', 'Efectivo': 'efectivo' };
  let seleccion = { categoria: null, pago: null };

  function escapeHtml(texto) {
    return String(texto).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function formatearFechaHora(fechaISO) {
    const d = new Date(fechaISO);
    return d.toLocaleString('es-CO', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
  }

  const INICIALES_CATEGORIA = {
    'Shaun': 'SH',
    'Swift': 'SW',
    'Salidas': 'SA',
    'Gastos Personales': 'GP',
    'Hogar': 'HO',
  };
  const BADGE_CATEGORIA = {
    'Shaun': 'badge-shaun',
    'Swift': 'badge-swift',
    'Salidas': 'badge-salidas',
    'Gastos Personales': 'badge-gp',
    'Hogar': 'badge-hogar',
  };

  function htmlDePagina(contenido, mesKey, resumen) {
    if (contenido === 'portada') {
      return `<div class="portada"><h2 class="masthead rounded">${nombreMes(mesKey)}</h2><p class="content">Total: ${moneda(resumen.total)}</p></div>`;
    }
    if (contenido === 'blanco') {
      return `
        <div class="masthead rounded">Recibo</div>
        <input type="text" id="monto" inputmode="numeric" placeholder="Monto" autocomplete="off">
        <div class="recibo-preview" id="reciboPreviewBox"><pre id="reciboPreview" class="content"></pre></div>
        <div class="grupo-titulo">Categoría</div>
        <div class="chips" id="chipsCategoria">
          ${CATEGORIAS.map(c => `<button type="button" class="chip chip-cat ${BADGE_CATEGORIA[c].replace('badge-', 'chip-')}" data-cat="${c}">${c}</button>`).join('')}
        </div>
        <div class="grupo-titulo">Forma de pago</div>
        <div class="chips" id="chipsPago">
          ${PAGOS.map(p => `<button type="button" class="chip chip-pago chip-${CLASE_PAGO[p]}" data-pago="${p}">${p}</button>`).join('')}
        </div>
        <div class="grupo-titulo">Nota (opcional)</div>
        <input type="text" id="nota" placeholder="Descripción del gasto" maxlength="140">
        <button id="guardarBtn" disabled style="display:none">Guardar gasto</button>
      `;
    }
    const badgeClase = BADGE_CATEGORIA[contenido.categoria] || 'badge-hogar';
    const bordeClase = badgeClase.replace('badge-', 'borde-');
    const iniciales = INICIALES_CATEGORIA[contenido.categoria] || '?';
    return `
      <div class="hoja-escrita ${bordeClase}">
        <div class="masthead rounded">Recibo</div>
        <p class="monto-grande rounded">${moneda(contenido.monto)}</p>
        <p class="content detalle-secundario"><span class="badge ${badgeClase}">${iniciales}</span>${contenido.categoria}</p>
        <p class="content detalle-secundario">${contenido.pago}</p>
        ${contenido.nota ? `<p class="content detalle-secundario nota-gasto">${escapeHtml(contenido.nota)}</p>` : ''}
        <p class="content detalle-secundario fecha-gasto">${formatearFechaHora(contenido.fecha)}</p>
        <button class="anular" data-id="${contenido.id}">Anular este gasto</button>
      </div>
    `;
  }

  function actualizarFiltroActivo() {
    const el = document.getElementById('filtroActivo');
    if (estado.categoriaFiltro) {
      const clase = BADGE_CATEGORIA[estado.categoriaFiltro].replace('badge-', 'chip-');
      el.innerHTML = `<button type="button" id="quitarFiltro" class="pastilla-filtro ${clase}">${escapeHtml(estado.categoriaFiltro)} ✕</button>`;
    } else if (estado.pagoFiltro) {
      const clase = `pastilla-${CLASE_PAGO[estado.pagoFiltro]}`;
      el.innerHTML = `<button type="button" id="quitarFiltro" class="pastilla-filtro ${clase}">${escapeHtml(estado.pagoFiltro)} ✕</button>`;
    } else {
      el.innerHTML = '';
    }
  }

  function marcarSeleccionActiva() {
    document.querySelectorAll('#chipsCategoria .chip').forEach(b => b.classList.toggle('selected', b.dataset.cat === seleccion.categoria));
    document.querySelectorAll('#chipsPago .chip').forEach(b => b.classList.toggle('selected', b.dataset.pago === seleccion.pago));
    ocultarGrupoChips('chipsCategoria', Boolean(seleccion.categoria));
    ocultarGrupoChips('chipsPago', Boolean(seleccion.pago));
  }

  // Una vez elegida la categoría/pago, se repite en la vista previa del
  // recibo ("Categoría: Shaun") y en el chip seleccionado a la vez — se
  // oculta el grupo entero (título + chips) en vez de solo los chips no
  // elegidos, y solo vuelve a aparecer si se deshace con la X de esa línea.
  function ocultarGrupoChips(idGrupo, ocultar) {
    const grupo = document.getElementById(idGrupo);
    if (!grupo) return;
    grupo.style.display = ocultar ? 'none' : '';
    const titulo = grupo.previousElementSibling;
    if (titulo && titulo.classList.contains('grupo-titulo')) titulo.style.display = ocultar ? 'none' : '';
  }

  // Mismo criterio que ocultarGrupoChips, pero para el campo de monto: se
  // oculta el input al confirmarlo (perder el foco con un valor válido) para
  // que no quede repetido con la línea "Monto: $X" de la vista previa
  // ocupando espacio a la vez, y vuelve a aparecer si se deshace con la X.
  function ocultarMontoConfirmado(ocultar) {
    const input = document.getElementById('monto');
    if (input) input.style.display = ocultar ? 'none' : '';
  }

  function montoConfirmado() {
    const input = document.getElementById('monto');
    return !!(input && input.style.display === 'none');
  }

  function actualizarGuardar() {
    const btn = document.getElementById('guardarBtn');
    const montoInput = document.getElementById('monto');
    if (!btn || !montoInput) return;
    const monto = numeroDesdeMonto(montoInput.value);
    const listo = monto > 0 && seleccion.categoria && seleccion.pago;
    // El botón ni aparece mientras falte algo por elegir — así no compite
    // por espacio con los campos que todavía se están llenando, y solo
    // ocupa lugar cuando de verdad hay algo que guardar.
    btn.style.display = listo ? '' : 'none';
    btn.disabled = !listo;
  }

  let animando = false;

  // El ángulo del doblez se calcula a partir de una distancia de arrastre fija
  // (no del alto real de la tarjeta): si dependiera del alto, con la tarjeta
  // grande compartida entre páginas un swipe normal con el dedo apenas movía
  // el ángulo un poco y el doblez se veía plano — hacía falta arrastrar casi
  // toda la pantalla para completarlo.
  const DISTANCIA_DOBLEZ_COMPLETO = 230;

  function commitCambioPagina(direccion) {
    const posicionAnterior = estado.posicion;
    estado.posicion += (direccion === 'arriba' ? -1 : 1);
    const datos = render();
    const alcanzoLimite = estado.posicion === posicionAnterior;
    return { datos, alcanzoLimite };
  }

  function moverPagina(direccion) {
    if (animando) return;
    const { datos, alcanzoLimite } = commitCambioPagina(direccion);
    const leaf = document.getElementById('leaf');
    if (alcanzoLimite) {
      leaf.classList.remove('rebote'); void leaf.offsetWidth; leaf.classList.add('rebote');
      return;
    }
    animando = true;
    leaf.classList.remove('saliendo-arriba', 'saliendo-abajo');
    void leaf.offsetWidth;
    const pageUnder = document.getElementById('pageUnder');
    pageUnder.innerHTML = datos.html;
    ocultarCajaReciboVacia(pageUnder);
    leaf.classList.add(direccion === 'arriba' ? 'saliendo-arriba' : 'saliendo-abajo');

    let terminado = false;
    const terminar = () => {
      if (terminado) return;
      terminado = true;
      leaf.style.transform = '';
      leaf.style.opacity = '';
      leaf.classList.remove('saliendo-arriba', 'saliendo-abajo');
      document.getElementById('faceFront').innerHTML = datos.html;
      document.getElementById('pageUnder').innerHTML = '';
      marcarSeleccionActiva();
      actualizarGuardar();
      actualizarRecibo();
      leaf.removeEventListener('animationend', terminar);
      animando = false;
    };
    leaf.addEventListener('animationend', terminar, { once: true });
    setTimeout(terminar, 260);
  }

  let arrastrePagina = null;

  function empezarArrastrePagina(direccion) {
    if (animando) return false;
    const { datos, alcanzoLimite } = commitCambioPagina(direccion);
    const notebook = document.getElementById('notebook');
    const leaf = document.getElementById('leaf');

    notebook.style.transition = 'none';
    leaf.style.transition = 'none';
    leaf.classList.remove('saliendo-arriba', 'saliendo-abajo', 'rebote');
    leaf.style.transform = 'translateY(0) rotate(0deg) scale(1)';
    leaf.style.opacity = '1';
    const pageUnder = document.getElementById('pageUnder');
    pageUnder.innerHTML = alcanzoLimite ? '' : datos.html;
    if (!alcanzoLimite) ocultarCajaReciboVacia(pageUnder);

    animando = true;
    arrastrePagina = { direccion, alcanzoLimite, datos, anguloActual: 0 };
    return true;
  }

  function actualizarArrastrePagina(deltaEnDireccion) {
    if (!arrastrePagina) return;
    const leaf = document.getElementById('leaf');

    let angulo = anguloDesdeArrastre(Math.max(0, deltaEnDireccion), DISTANCIA_DOBLEZ_COMPLETO);
    if (arrastrePagina.alcanzoLimite) angulo = Math.min(angulo, 18);

    const progreso = angulo / 180;
    const signo = arrastrePagina.direccion === 'arriba' ? -1 : 1;
    const desplazamiento = signo * progreso * 115;
    const rotacion = signo * progreso * 3;
    const escala = 1 - progreso * 0.08;
    leaf.style.transform = `translateY(${desplazamiento}%) rotate(${rotacion}deg) scale(${escala})`;
    leaf.style.opacity = String(1 - progreso);
    arrastrePagina.anguloActual = angulo;
  }

  function terminarArrastrePagina() {
    if (!arrastrePagina) return;
    const { direccion, alcanzoLimite, anguloActual, datos } = arrastrePagina;
    const notebook = document.getElementById('notebook');
    const leaf = document.getElementById('leaf');
    const completar = !alcanzoLimite && debeCompletarDoblez(anguloActual);
    const signo = direccion === 'arriba' ? -1 : 1;

    leaf.style.transition = 'transform .2s cubic-bezier(.4,0,.2,1), opacity .2s ease';

    if (completar) {
      leaf.style.transform = `translateY(${signo * 115}%) rotate(${signo * 3}deg) scale(0.92)`;
      leaf.style.opacity = '0';
      setTimeout(() => {
        leaf.style.transition = '';
        leaf.style.transform = '';
        leaf.style.opacity = '';
        document.getElementById('faceFront').innerHTML = datos.html;
        document.getElementById('pageUnder').innerHTML = '';
        notebook.style.transition = '';
        marcarSeleccionActiva();
        actualizarGuardar();
        actualizarRecibo();
        animando = false;
        arrastrePagina = null;
      }, 200);
      return;
    }

    if (!alcanzoLimite) {
      estado.posicion += (direccion === 'arriba' ? 1 : -1);
      render();
    } else {
      notebook.classList.remove('rebote'); void notebook.offsetWidth; notebook.classList.add('rebote');
    }
    leaf.style.transform = 'translateY(0) rotate(0deg) scale(1)';
    leaf.style.opacity = '1';
    setTimeout(() => {
      leaf.style.transition = '';
      leaf.style.transform = '';
      leaf.style.opacity = '';
      document.getElementById('pageUnder').innerHTML = '';
      notebook.style.transition = '';
      animando = false;
      arrastrePagina = null;
    }, 200);
  }

  // Atajo de Siri (Apple Shortcuts): la app puede abrirse con
  // ?monto=20000&categoria=Salidas&pago=BreB&nota=algo — si vienen esos
  // parámetros, se prellena la hoja en blanco con esos valores, pero NO se
  // guarda solo; el usuario sigue teniendo que tocar "Guardar gasto".
  // categoria/pago deben coincidir exactamente con CATEGORIAS/PAGOS — si no
  // coinciden, ese campo puntual simplemente no se preselecciona.
  function precargarDesdeURL() {
    const params = new URLSearchParams(location.search);
    const montoParam = params.get('monto');
    const categoriaParam = params.get('categoria');
    if (!montoParam && !categoriaParam) return false;

    const pagoParam = params.get('pago');
    const notaParam = params.get('nota');

    if (categoriaParam && CATEGORIAS.includes(categoriaParam)) seleccion.categoria = categoriaParam;
    if (pagoParam && PAGOS.includes(pagoParam)) seleccion.pago = pagoParam;

    estado.posicion = 0;
    render();

    const montoInput = document.getElementById('monto');
    const notaInput = document.getElementById('nota');
    const soloDigitos = (montoParam || '').replace(/\D/g, '');
    if (montoInput && soloDigitos) {
      montoInput.value = Number(soloDigitos).toLocaleString('es-CO');
      ocultarMontoConfirmado(true);
    }
    if (notaInput && notaParam) notaInput.value = notaParam.slice(0, 140);

    marcarSeleccionActiva();
    actualizarGuardar();
    actualizarRecibo();
    recalcularAlturaYMantenerVisible();

    history.replaceState(null, '', location.pathname);
    return true;
  }

  function guardarGasto() {
    const monto = numeroDesdeMonto(document.getElementById('monto').value);
    if (!(monto > 0) || !seleccion.categoria || !seleccion.pago) return;
    const notaInput = document.getElementById('nota');
    const nota = notaInput ? notaInput.value.trim() : '';
    const gastos = cargarGastos();
    gastos.push({ id: Date.now(), monto, categoria: seleccion.categoria, pago: seleccion.pago, nota, fecha: new Date().toISOString() });
    guardarGastos(gastos);
    seleccion = { categoria: null, pago: null };

    const stamp = document.getElementById('stamp');
    stamp.classList.remove('show'); void stamp.offsetWidth; stamp.classList.add('show');

    setTimeout(() => moverPagina('abajo'), 250);
  }

  function escribirTexto(el, texto) {
    clearInterval(el._intervalo);
    el.textContent = '';
    let i = 0;
    el._intervalo = setInterval(() => {
      el.textContent += texto[i];
      i += 1;
      if (i >= texto.length) clearInterval(el._intervalo);
    }, 18);
  }

  // Cada línea del recibo (categoría, pago, monto) se anima con máquina de
  // escribir SOLO la primera vez que aparece. Si el usuario cambia de opinión
  // y vuelve a tocar un chip ya elegido, el texto de esa línea se reemplaza
  // al instante, sin reiniciar la animación completa.
  let lineasEscritas = {};

  // La caja se muestra en cuanto haya algo que mostrar (categoría, pago,
  // nota, o el monto YA confirmado) — el monto cuenta solo una vez
  // confirmado para no repetirse con su propio input, que en ese caso
  // sigue visible; categoría/pago/nota no tienen ese problema porque su
  // chip/grupo ya se oculta apenas se eligen.
  function reciboTieneContenido() {
    const montoInput = document.getElementById('monto');
    const notaInput = document.getElementById('nota');
    const monto = montoInput ? numeroDesdeMonto(montoInput.value) : NaN;
    const nota = notaInput ? notaInput.value.trim() : '';
    return Boolean(seleccion.categoria || seleccion.pago || (montoConfirmado() && monto > 0) || nota);
  }

  // La copia de la hoja en blanco que se pone en #pageUnder durante la
  // transición (mientras la hoja vieja se desliza) nunca pasa por
  // actualizarRecibo() — ese ocultamiento solo corre cuando la página se
  // vuelve la real en #faceFront al terminar. Sin este ajuste, la caja de
  // vista previa se veía vacía y visible durante todo el arrastre, y recién
  // desaparecía de golpe al asentarse la página.
  function ocultarCajaReciboVacia(contenedor) {
    const caja = contenedor && contenedor.querySelector('#reciboPreviewBox');
    if (caja) caja.style.display = reciboTieneContenido() ? '' : 'none';
  }

  function actualizarRecibo() {
    const el = document.getElementById('reciboPreview');
    if (!el) return;
    if (!el.dataset.inicializado) {
      lineasEscritas = {};
      el.innerHTML = '';
      ['categoria', 'pago', 'monto', 'nota'].forEach(key => {
        const linea = document.createElement('div');
        linea.className = 'linea-recibo';
        linea.dataset.linea = key;
        linea.style.display = 'none';
        const texto = document.createElement('span');
        texto.className = 'texto-linea';
        linea.appendChild(texto);
        const btnX = document.createElement('button');
        btnX.type = 'button';
        btnX.className = 'deshacer-linea';
        btnX.dataset.deshacer = key;
        btnX.setAttribute('aria-label', 'Quitar');
        btnX.textContent = '×';
        linea.appendChild(btnX);
        el.appendChild(linea);
      });
      el.dataset.inicializado = '1';
    }

    const montoInput = document.getElementById('monto');
    const notaInput = document.getElementById('nota');
    const monto = montoInput ? numeroDesdeMonto(montoInput.value) : NaN;
    const nota = notaInput ? notaInput.value.trim() : '';
    const valores = {
      categoria: seleccion.categoria ? `Categoría: ${seleccion.categoria}` : null,
      pago: seleccion.pago ? `Pago: ${seleccion.pago}` : null,
      monto: (montoConfirmado() && monto > 0) ? `Monto: ${moneda(monto)}` : null,
      nota: nota ? `Nota: ${nota}` : null,
    };

    Object.keys(valores).forEach(key => {
      const linea = el.querySelector(`[data-linea="${key}"]`);
      const spanTexto = linea.querySelector('.texto-linea');
      const texto = valores[key];
      if (!texto) {
        clearInterval(spanTexto._intervalo);
        linea.style.display = 'none';
        spanTexto.textContent = '';
        delete lineasEscritas[key];
        return;
      }
      linea.style.display = '';
      if (lineasEscritas[key] !== texto) {
        if (!lineasEscritas[key]) escribirTexto(spanTexto, texto);
        else {
          // El reemplazo instantáneo también debe cortar el intervalo de la
          // animación de máquina de escribir si todavía estaba corriendo,
          // o sus caracteres pendientes se siguen agregando por encima del
          // texto nuevo (se vio como texto pegado/duplicado al cambiar de
          // categoría muy rápido).
          clearInterval(spanTexto._intervalo);
          spanTexto.textContent = texto;
        }
        lineasEscritas[key] = texto;
      }
    });

    const contenedor = document.getElementById('reciboPreviewBox');
    if (contenedor) contenedor.style.display = reciboTieneContenido() ? '' : 'none';
  }

  document.getElementById('notebook').addEventListener('click', (e) => {
    const btnDeshacer = e.target.closest('.deshacer-linea');
    if (btnDeshacer) {
      const key = btnDeshacer.dataset.deshacer;
      if (key === 'categoria') seleccion.categoria = null;
      else if (key === 'pago') seleccion.pago = null;
      else if (key === 'monto') { const mi = document.getElementById('monto'); if (mi) { mi.value = ''; ocultarMontoConfirmado(false); mi.focus(); } }
      else if (key === 'nota') { const ni = document.getElementById('nota'); if (ni) ni.value = ''; }
      marcarSeleccionActiva();
      actualizarGuardar();
      actualizarRecibo();
      recalcularAlturaYMantenerVisible();
      return;
    }
    const catBtn = e.target.closest('#chipsCategoria .chip');
    if (catBtn) { seleccion.categoria = catBtn.dataset.cat; marcarSeleccionActiva(); actualizarGuardar(); actualizarRecibo(); recalcularAlturaYMantenerVisible(); return; }
    const pagoBtn = e.target.closest('#chipsPago .chip');
    if (pagoBtn) { seleccion.pago = pagoBtn.dataset.pago; marcarSeleccionActiva(); actualizarGuardar(); actualizarRecibo(); recalcularAlturaYMantenerVisible(); return; }
    if (e.target.id === 'guardarBtn') guardarGasto();
    const anularBtn = e.target.closest('.anular');
    if (!anularBtn) return;
    if (!confirm('¿Anular este gasto? No se puede deshacer.')) return;
    const id = Number(anularBtn.dataset.id);
    const gastos = cargarGastos().filter(g => g.id !== id);
    guardarGastos(gastos);
    window._paginaInicial = false;
    estado.posicion = -1;
    render();
  });

  // En iPhone, tocar un botón mientras un input todavía tiene el teclado
  // abierto a veces solo le quita el foco a ese input (cerrando el teclado)
  // sin que el toque llegue a disparar el clic del botón — hay que tocar dos
  // veces. Para "Guardar gasto" eso es especialmente molesto (parece que no
  // pasó nada), así que se dispara directo en touchend, sin esperar el
  // clic sintético que Safari puede perderse en esa combinación.
  document.getElementById('notebook').addEventListener('touchend', (e) => {
    if (e.target.id !== 'guardarBtn') return;
    e.preventDefault();
    guardarGasto();
  }, { passive: false });

  document.getElementById('notebook').addEventListener('input', (e) => {
    if (e.target.id === 'monto') formatearMontoInput(e.target);
    if (e.target.id === 'monto' || e.target.id === 'nota') { actualizarGuardar(); actualizarRecibo(); recalcularAlturaYMantenerVisible(); }
  });

  document.getElementById('resumen').addEventListener('click', (e) => {
    const fila = e.target.closest('.resumen-fila');
    if (!fila) return;
    if (fila.dataset.categoria) {
      const cat = fila.dataset.categoria;
      estado.categoriaFiltro = (estado.categoriaFiltro === cat) ? null : cat;
      estado.pagoFiltro = null;
    } else if (fila.dataset.pago) {
      const pago = fila.dataset.pago;
      estado.pagoFiltro = (estado.pagoFiltro === pago) ? null : pago;
      estado.categoriaFiltro = null;
    }
    estado._saltarAlFiltrar = true;
    window._paginaInicial = false;
    render();
  });

  document.getElementById('filtroActivo').addEventListener('click', (e) => {
    if (!e.target.closest('#quitarFiltro')) return;
    estado.categoriaFiltro = null;
    estado.pagoFiltro = null;
    estado._saltarAlFiltrar = true;
    window._paginaInicial = false;
    render();
  });

  // La caja de vista previa (#reciboPreviewBox) aparece/crece cuando el usuario
  // elige categoría, pago o escribe el monto, pero el alto del cuaderno solo se
  // calculaba una vez al entrar a la hoja en blanco (con la caja aún vacía). Sin
  // volver a medir, el contenido nuevo quedaba tapado: la tarjeta no crece y,
  // como el gesto de doblar página bloquea el scroll táctil dentro de ella
  // (touch-action: none en #notebook), no había forma de alcanzar "Guardar
  // gasto" arrastrando el dedo.
  function recalcularAlturaYMantenerVisible() {
    const faceFront = document.getElementById('faceFront');
    if (faceFront) ajustarAltura(faceFront.innerHTML);
    setTimeout(mantenerGuardarVisible, 260);
  }

  function mantenerGuardarVisible() {
    const btn = document.getElementById('guardarBtn');
    if (btn) btn.scrollIntoView({ block: 'end', behavior: 'smooth' });
  }

  document.getElementById('notebook').addEventListener('focusin', (e) => {
    if (e.target.id === 'monto') setTimeout(mantenerGuardarVisible, 350);
  });

  // Al confirmar el monto (perder el foco con un valor válido) se oculta el
  // input — ya queda la línea "Monto: $X" en la vista previa, no hace falta
  // tenerlos los dos a la vez ocupando espacio mientras se llenan las demás
  // opciones.
  document.getElementById('notebook').addEventListener('focusout', (e) => {
    if (e.target.id !== 'monto') return;
    if (numeroDesdeMonto(e.target.value) > 0) {
      ocultarMontoConfirmado(true);
      actualizarRecibo();
      recalcularAlturaYMantenerVisible();
    }
  });

  function cambiarMes(delta) {
    if (animando) return;
    const notebook = document.getElementById('notebook');
    const gastos = cargarGastos();
    const gastosPorMes = agruparPorMes(gastos);
    const meses = mesesDisponibles(gastosPorMes, mesActualKey());
    const mesIndexAnterior = estado.mesIndex;
    const nuevoIndex = clamp(mesIndexAnterior + delta, 0, meses.length - 1);

    if (nuevoIndex === mesIndexAnterior) {
      notebook.classList.remove('rebote'); void notebook.offsetWidth; notebook.classList.add('rebote');
      return;
    }

    animando = true;
    const direccion = delta > 0 ? 'izq' : 'der';
    notebook.classList.remove('mes-mostrar');
    notebook.classList.add('mes-saliendo', direccion);

    setTimeout(() => {
      estado.mesIndex = nuevoIndex;
      estado.posicion = -1;
      if (estado.categoriaFiltro || estado.pagoFiltro) estado._saltarAlFiltrar = true;
      window._paginaInicial = false;
      render();

      notebook.classList.remove('mes-saliendo');
      notebook.classList.add('mes-entrando', direccion);
      void notebook.offsetWidth;
      requestAnimationFrame(() => {
        notebook.classList.remove('mes-entrando');
        notebook.classList.add('mes-mostrar');
      });
      setTimeout(() => {
        notebook.classList.remove(direccion, 'mes-mostrar');
        animando = false;
      }, 350);
    }, 260);
  }

  document.getElementById('btnMesAnterior').addEventListener('click', () => cambiarMes(-1));
  document.getElementById('btnMesSiguiente').addEventListener('click', () => cambiarMes(1));
  document.getElementById('btnMesAnteriorVisible').addEventListener('click', () => cambiarMes(-1));
  document.getElementById('btnMesSiguienteVisible').addEventListener('click', () => cambiarMes(1));
  document.getElementById('btnArriba').addEventListener('click', () => moverPagina('arriba'));
  document.getElementById('btnAbajo').addEventListener('click', () => moverPagina('abajo'));

  (function gestos() {
    const UMBRAL_EJE = 10;
    const UMBRAL_X = 60;
    let inicio = null;
    let eje = null;
    // El dedo puede disparar touchmove más rápido de lo que la pantalla
    // repinta. Escribir el transform/border-radius en cada evento (en vez de
    // una vez por frame) era el principal culpable de que el doblez se viera
    // poco fluido, así que se agrupa: se guarda el último delta y se aplica
    // una sola vez por frame con requestAnimationFrame.
    let rafPendiente = null;
    let deltaPendiente = 0;

    // Solo los campos de texto necesitan quedar exentos (para no robarle el
    // arrastre horizontal a la selección/cursor de texto). Los chips y
    // botones no tienen ningún gesto propio que proteger, así que un
    // arrastre vertical que empiece sobre ellos también debe doblar la
    // página — si no, la hoja de agregar gasto (llena de chips e inputs) se
    // sentía como si a veces el dedo "se comiera" el gesto de pasar página.
    function esCampoDeTexto(el) {
      return !!(el && el.closest && el.closest('input, textarea, [contenteditable]'));
    }

    function empezar(x, y, target) {
      inicio = { x, y, target };
      eje = null;
    }

    function mover(x, y, evento) {
      if (!inicio) return;
      const deltaX = x - inicio.x;
      const deltaY = y - inicio.y;

      if (eje === null) {
        if (Math.abs(deltaX) < UMBRAL_EJE && Math.abs(deltaY) < UMBRAL_EJE) return;
        eje = Math.abs(deltaX) > Math.abs(deltaY) ? 'horizontal' : 'vertical';
        if (eje === 'vertical') {
          const direccion = deltaY < 0 ? 'arriba' : 'abajo';
          empezarArrastrePagina(direccion);
        } else if (esCampoDeTexto(inicio.target)) {
          // Deja el arrastre horizontal para el comportamiento nativo del
          // campo de texto (mover el cursor, seleccionar), no lo toma como
          // intento de cambiar de mes.
          eje = 'ignorado';
        }
      }

      if (eje === 'vertical' && arrastrePagina) {
        if (evento.cancelable) evento.preventDefault();
        deltaPendiente = arrastrePagina.direccion === 'arriba' ? -deltaY : deltaY;
        if (rafPendiente === null) {
          rafPendiente = requestAnimationFrame(() => {
            rafPendiente = null;
            actualizarArrastrePagina(deltaPendiente);
          });
        }
      } else if (eje === 'horizontal') {
        if (evento.cancelable) evento.preventDefault();
      }
    }

    function terminar(x, y) {
      if (rafPendiente !== null) { cancelAnimationFrame(rafPendiente); rafPendiente = null; }
      if (eje === 'vertical' && arrastrePagina) {
        terminarArrastrePagina();
      } else if (eje === 'horizontal' && inicio) {
        const deltaX = x - inicio.x;
        if (deltaX <= -UMBRAL_X) cambiarMes(1);
        else if (deltaX >= UMBRAL_X) cambiarMes(-1);
      }
      inicio = null;
      eje = null;
    }

    const notebook = document.getElementById('notebook');
    notebook.addEventListener('touchstart', (e) => empezar(e.touches[0].clientX, e.touches[0].clientY, e.target), { passive: true });
    notebook.addEventListener('touchmove', (e) => mover(e.touches[0].clientX, e.touches[0].clientY, e), { passive: false });
    notebook.addEventListener('touchend', (e) => terminar(e.changedTouches[0].clientX, e.changedTouches[0].clientY));

    notebook.addEventListener('mousedown', (e) => empezar(e.clientX, e.clientY, e.target));
    document.addEventListener('mousemove', (e) => { if (inicio) mover(e.clientX, e.clientY, e); });
    document.addEventListener('mouseup', (e) => terminar(e.clientX, e.clientY));
  })();

  // Swipe horizontal dedicado sobre el encabezado del mes, aparte del gesto
  // combinado del cuaderno. Un swipe con el dedo casi nunca es perfectamente
  // horizontal, y el detector del cuaderno (que también maneja el doblez
  // vertical) puede confundirlo con un intento de pasar página; aquí solo se
  // mide el desplazamiento final, sin competir con ese otro gesto.
  (function swipeMes() {
    const UMBRAL_X_MES = 40;
    let inicioX = null;
    let inicioY = null;

    function empezar(x, y) { inicioX = x; inicioY = y; }
    function terminar(x, y) {
      if (inicioX === null) return;
      const deltaX = x - inicioX;
      const deltaY = y - inicioY;
      inicioX = null;
      inicioY = null;
      if (Math.abs(deltaX) < UMBRAL_X_MES || Math.abs(deltaX) < Math.abs(deltaY)) return;
      if (deltaX <= -UMBRAL_X_MES) cambiarMes(1);
      else if (deltaX >= UMBRAL_X_MES) cambiarMes(-1);
    }

    const mesNav = document.getElementById('mesNav');
    mesNav.addEventListener('touchstart', (e) => empezar(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
    mesNav.addEventListener('touchend', (e) => terminar(e.changedTouches[0].clientX, e.changedTouches[0].clientY));
    mesNav.addEventListener('mousedown', (e) => empezar(e.clientX, e.clientY));
    document.addEventListener('mouseup', (e) => { if (inicioX !== null) terminar(e.clientX, e.clientY); });
  })();

  ajustarAltura(htmlDePagina('blanco'));
  if (!precargarDesdeURL()) render();
</script>
</body>
</html>
