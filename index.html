<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gastos">
<title>Mis Gastos</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #EEF0E7;
    --card: #FBFBF7;
    --ink: #1C231F;
    --muted: #6B7268;
    --line: #DEDFD3;
    --emerald: #1F6F54;
    --emerald-deep: #14503C;
    --gold: #B98A2E;
    --coral: #B5473A;

    --tag-shaun: #2F8F6B;
    --tag-swift: #B98A2E;
    --tag-salidas: #B5473A;
    --tag-gp: #46626F;
    --tag-hogar: #8A6A4E;

    --shadow: 0 8px 24px rgba(20, 30, 24, 0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10140F;
      --card: #1A201A;
      --ink: #ECEEE7;
      --muted: #9AA296;
      --line: #2A302A;
      --emerald: #46B583;
      --emerald-deep: #2E8A63;
      --gold: #D9AE5C;
      --coral: #E2695A;

      --tag-shaun: #46B583;
      --tag-swift: #D9AE5C;
      --tag-salidas: #E2695A;
      --tag-gp: #7C99A6;
      --tag-hogar: #B3936F;

      --shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
    }
  }
  :root[data-theme="dark"] {
    --bg: #10140F; --card: #1A201A; --ink: #ECEEE7; --muted: #9AA296; --line: #2A302A;
    --emerald: #46B583; --emerald-deep: #2E8A63; --gold: #D9AE5C; --coral: #E2695A;
    --tag-shaun: #46B583; --tag-swift: #D9AE5C; --tag-salidas: #E2695A; --tag-gp: #7C99A6; --tag-hogar: #B3936F;
    --shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
  }
  :root[data-theme="light"] {
    --bg: #EEF0E7; --card: #FBFBF7; --ink: #1C231F; --muted: #6B7268; --line: #DEDFD3;
    --emerald: #1F6F54; --emerald-deep: #14503C; --gold: #B98A2E; --coral: #B5473A;
    --tag-shaun: #2F8F6B; --tag-swift: #B98A2E; --tag-salidas: #B5473A; --tag-gp: #46626F; --tag-hogar: #8A6A4E;
    --shadow: 0 8px 24px rgba(20, 30, 24, 0.10);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .rounded { font-family: ui-rounded, -apple-system, BlinkMacSystemFont, sans-serif; }

  .app {
    max-width: 480px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 18px) 18px 110px;
  }

  /* ---------- Tarjeta de saldo (tiquete) ---------- */
  .balance {
    position: relative;
    background: var(--card);
    border-radius: 20px 20px 0 0;
    padding: 22px 22px 26px;
    box-shadow: var(--shadow);
    margin-bottom: 30px;
  }
  .balance-eyebrow {
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }
  .balance-amount {
    font-size: 2.75rem;
    font-weight: 800;
    line-height: 1.15;
    margin-top: 6px;
    font-variant-numeric: tabular-nums;
    color: var(--emerald-deep);
  }
  :root[data-theme="dark"] .balance-amount,
  @media (prefers-color-scheme: dark) { .balance-amount { color: var(--emerald); } }
  .balance-sub {
    font-size: 0.82rem;
    color: var(--muted);
    margin-top: 2px;
  }
  .ticket-edge {
    position: absolute;
    left: 0; right: 0; bottom: -13px;
    height: 14px;
    background: var(--card);
    -webkit-mask-image: linear-gradient(135deg, transparent 7px, black 7.5px), linear-gradient(-135deg, transparent 7px, black 7.5px);
    mask-image: linear-gradient(135deg, transparent 7px, black 7.5px), linear-gradient(-135deg, transparent 7px, black 7.5px);
    -webkit-mask-size: 14px 14px;
    mask-size: 14px 14px;
    -webkit-mask-position: bottom left;
    mask-position: bottom left;
    -webkit-mask-repeat: repeat-x;
    mask-repeat: repeat-x;
    filter: drop-shadow(0 6px 6px rgba(20,30,24,0.06));
  }

  /* ---------- Lista de gastos ---------- */
  .day-label {
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 700;
    margin: 22px 4px 10px;
  }
  .day-label:first-child { margin-top: 0; }

  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    padding: 14px 16px;
    border-radius: 14px;
    margin-bottom: 8px;
    box-shadow: var(--shadow);
  }
  .badge {
    width: 40px; height: 40px;
    border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.78rem;
    font-weight: 800;
    color: white;
    flex-shrink: 0;
  }
  .badge-shaun { background: var(--tag-shaun); }
  .badge-swift { background: var(--tag-swift); }
  .badge-salidas { background: var(--tag-salidas); }
  .badge-gp { background: var(--tag-gp); }
  .badge-hogar { background: var(--tag-hogar); }

  .row-info { flex: 1; min-width: 0; }
  .row-cat { font-weight: 700; font-size: 0.96rem; }
  .row-meta { font-size: 0.8rem; color: var(--muted); margin-top: 1px; display: flex; align-items: center; gap: 5px; }
  .row-amount {
    font-weight: 800;
    font-size: 1.05rem;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .row-del {
    width: 28px; height: 28px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 1rem;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .row-del:active { background: var(--line); }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 50px 20px;
    font-size: 0.92rem;
    line-height: 1.5;
  }
  .empty svg { margin-bottom: 10px; opacity: 0.5; }

  /* ---------- Botón flotante ---------- */
  .fab {
    position: fixed;
    right: 24px;
    bottom: calc(env(safe-area-inset-bottom) + 26px);
    width: 60px; height: 60px;
    border-radius: 50%;
    background: var(--emerald);
    color: white;
    border: none;
    font-size: 1.9rem;
    line-height: 1;
    box-shadow: 0 10px 24px rgba(20, 90, 65, 0.35);
    display: flex; align-items: center; justify-content: center;
    z-index: 20;
  }
  .fab:active { background: var(--emerald-deep); }

  /* ---------- Hoja para agregar gasto ---------- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(10, 14, 10, 0.45);
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 30;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--bg);
    border-radius: 22px 22px 0 0;
    padding: 14px 20px calc(env(safe-area-inset-bottom) + 24px);
    max-width: 480px;
    margin: 0 auto;
    transform: translateY(105%);
    transition: transform 0.28s cubic-bezier(.32,.72,0,1);
    z-index: 31;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.25);
    max-height: 88vh;
    overflow-y: auto;
  }
  .sheet.show { transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) {
    .sheet, .overlay { transition: none; }
  }

  .sheet-top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 6px;
  }
  .sheet-handle {
    width: 36px; height: 4px;
    background: var(--line);
    border-radius: 3px;
    margin: 2px auto 14px;
  }
  .sheet h2 { font-size: 1.1rem; margin: 0 0 18px; }
  .sheet-close {
    border: none; background: var(--card); color: var(--muted);
    width: 30px; height: 30px; border-radius: 50%; font-size: 0.95rem;
  }

  .amount-wrap {
    display: flex; align-items: baseline; justify-content: center;
    gap: 4px;
    margin: 6px 0 26px;
  }
  .amount-wrap .currency { font-size: 1.7rem; font-weight: 700; color: var(--muted); }
  .amount-wrap input {
    border: none; background: none; outline: none;
    font-size: 3rem; font-weight: 800;
    color: var(--ink);
    width: 100%; max-width: 240px;
    text-align: left;
    font-variant-numeric: tabular-nums;
    padding: 0;
  }

  .field-title {
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 700;
    margin: 4px 0 10px;
  }
  .chip-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 22px;
  }
  .chip {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 12px 4px;
    border-radius: 14px;
    border: 1.5px solid var(--line);
    background: var(--card);
    color: var(--ink);
    font-size: 0.78rem;
    font-weight: 600;
    text-align: center;
  }
  .chip .badge { width: 30px; height: 30px; font-size: 0.68rem; }
  .chip.selected {
    border-color: var(--emerald);
    background: color-mix(in srgb, var(--emerald) 12%, var(--card));
  }
  .chip svg { width: 22px; height: 22px; stroke: var(--ink); }
  .chip.selected svg { stroke: var(--emerald); }

  .guardar {
    width: 100%;
    padding: 16px;
    font-size: 1rem;
    font-weight: 700;
    border: none;
    border-radius: 14px;
    background: var(--line);
    color: var(--muted);
    transition: background 0.2s, color 0.2s;
  }
  .guardar.ready {
    background: var(--emerald);
    color: white;
  }
  .guardar.ready:active { background: var(--emerald-deep); }

  .borrar-todo {
    display: block;
    margin: 30px auto 0;
    background: none; border: none;
    color: var(--coral);
    font-size: 0.8rem;
    padding: 8px;
  }
</style>
</head>
<body>
<div class="app">

  <div class="balance">
    <div class="balance-eyebrow rounded">Mis Gastos</div>
    <div class="balance-amount rounded" id="total">$0</div>
    <div class="balance-sub">Total registrado</div>
    <div class="ticket-edge"></div>
  </div>

  <div id="lista"></div>

  <button class="borrar-todo" id="borrarTodo">Borrar todos los registros</button>
</div>

<button class="fab rounded" id="abrirForm" aria-label="Agregar gasto">+</button>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-top">
    <h2 class="rounded">Nuevo gasto</h2>
    <button class="sheet-close" id="cerrarForm" aria-label="Cerrar">✕</button>
  </div>

  <div class="amount-wrap">
    <span class="currency rounded">$</span>
    <input type="number" id="monto" inputmode="decimal" placeholder="0" class="rounded">
  </div>

  <div class="field-title">Categoría</div>
  <div class="chip-grid" id="categoriaChips">
    <button type="button" class="chip" data-cat="Shaun"><span class="badge badge-shaun">SH</span>Shaun</button>
    <button type="button" class="chip" data-cat="Swift"><span class="badge badge-swift">SW</span>Swift</button>
    <button type="button" class="chip" data-cat="Salidas"><span class="badge badge-salidas">SA</span>Salidas</button>
    <button type="button" class="chip" data-cat="Gastos Personales"><span class="badge badge-gp">GP</span>Gastos<br>Personales</button>
    <button type="button" class="chip" data-cat="Hogar"><span class="badge badge-hogar">HO</span>Hogar</button>
  </div>

  <div class="field-title">¿Cómo pagaste?</div>
  <div class="chip-grid" id="pagoChips">
    <button type="button" class="chip" data-pago="BreB">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13M17 8l-3-3M17 8l-3 3"/><path d="M20 16H7M7 16l3-3M7 16l3 3"/></svg>
      BreB
    </button>
    <button type="button" class="chip" data-pago="RappiCard">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><path d="M7 15h4"/></svg>
      RappiCard
    </button>
    <button type="button" class="chip" data-pago="Efectivo">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="7" width="19" height="11" rx="2"/><circle cx="12" cy="12.5" r="2.6"/></svg>
      Efectivo
    </button>
  </div>

  <button class="guardar rounded" id="guardarBtn" disabled>Guardar gasto</button>
</div>

<script>
  const KEY = 'gastos_v1';
  const BADGE = { Shaun: 'shaun', Swift: 'swift', Salidas: 'salidas', 'Gastos Personales': 'gp', Hogar: 'hogar' };
  const INIC = { Shaun: 'SH', Swift: 'SW', Salidas: 'SA', 'Gastos Personales': 'GP', Hogar: 'HO' };

  let categoriaSel = null;
  let pagoSel = null;

  function cargar() { return JSON.parse(localStorage.getItem(KEY) || '[]'); }
  function guardar(gastos) { localStorage.setItem(KEY, JSON.stringify(gastos)); }
  function moneda(n) { return '$' + Math.round(n).toLocaleString('es-CO'); }

  function etiquetaDia(iso) {
    const d = new Date(iso);
    const hoy = new Date();
    const ayer = new Date(); ayer.setDate(hoy.getDate() - 1);
    const mismoDia = (a, b) => a.toDateString() === b.toDateString();
    if (mismoDia(d, hoy)) return 'Hoy';
    if (mismoDia(d, ayer)) return 'Ayer';
    return d.toLocaleDateString('es-CO', { day: 'numeric', month: 'long' });
  }
  function hora(iso) {
    return new Date(iso).toLocaleTimeString('es-CO', { hour: 'numeric', minute: '2-digit' });
  }

  function render() {
    const gastos = cargar();
    const total = gastos.reduce((acc, g) => acc + g.monto, 0);
    document.getElementById('total').textContent = moneda(total);

    const lista = document.getElementById('lista');
    if (gastos.length === 0) {
      lista.innerHTML = `<div class="empty">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2V3z"/><path d="M8 8h8M8 12h8M8 16h4"/></svg>
        <div>Aún no hay gastos.<br>Toca el botón + para registrar el primero.</div>
      </div>`;
      return;
    }

    const ordenados = [...gastos].reverse();
    let html = '';
    let grupoActual = null;
    for (const g of ordenados) {
      const etiqueta = etiquetaDia(g.fecha);
      if (etiqueta !== grupoActual) {
        html += `<div class="day-label">${etiqueta}</div>`;
        grupoActual = etiqueta;
      }
      html += `
        <div class="row">
          <div class="badge badge-${BADGE[g.categoria] || 'gp'}">${INIC[g.categoria] || '?'}</div>
          <div class="row-info">
            <div class="row-cat">${g.categoria}</div>
            <div class="row-meta">${g.pago} · ${hora(g.fecha)}</div>
          </div>
          <div class="row-amount">${moneda(g.monto)}</div>
          <button class="row-del" data-id="${g.id}" aria-label="Borrar">✕</button>
        </div>`;
    }
    lista.innerHTML = html;
  }

  function actualizarGuardar() {
    const monto = parseFloat(document.getElementById('monto').value);
    const listo = monto > 0 && categoriaSel && pagoSel;
    const btn = document.getElementById('guardarBtn');
    btn.disabled = !listo;
    btn.classList.toggle('ready', listo);
  }

  document.getElementById('categoriaChips').addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    document.querySelectorAll('#categoriaChips .chip').forEach(c => c.classList.remove('selected'));
    chip.classList.add('selected');
    categoriaSel = chip.dataset.cat;
    actualizarGuardar();
  });

  document.getElementById('pagoChips').addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    document.querySelectorAll('#pagoChips .chip').forEach(c => c.classList.remove('selected'));
    chip.classList.add('selected');
    pagoSel = chip.dataset.pago;
    actualizarGuardar();
  });

  document.getElementById('monto').addEventListener('input', actualizarGuardar);

  function abrirSheet() {
    document.getElementById('overlay').classList.add('show');
    document.getElementById('sheet').classList.add('show');
    setTimeout(() => document.getElementById('monto').focus(), 300);
  }
  function cerrarSheet() {
    document.getElementById('overlay').classList.remove('show');
    document.getElementById('sheet').classList.remove('show');
  }
  function resetForm() {
    document.getElementById('monto').value = '';
    categoriaSel = null; pagoSel = null;
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
    actualizarGuardar();
  }

  document.getElementById('abrirForm').addEventListener('click', abrirSheet);
  document.getElementById('cerrarForm').addEventListener('click', cerrarSheet);
  document.getElementById('overlay').addEventListener('click', cerrarSheet);

  document.getElementById('guardarBtn').addEventListener('click', () => {
    const monto = parseFloat(document.getElementById('monto').value);
    if (!(monto > 0) || !categoriaSel || !pagoSel) return;
    const gastos = cargar();
    gastos.push({ id: Date.now(), monto, categoria: categoriaSel, pago: pagoSel, fecha: new Date().toISOString() });
    guardar(gastos);
    resetForm();
    cerrarSheet();
    render();
  });

  document.getElementById('lista').addEventListener('click', (e) => {
    const btn = e.target.closest('.row-del');
    if (!btn) return;
    const gastos = cargar().filter(g => g.id !== Number(btn.dataset.id));
    guardar(gastos);
    render();
  });

  document.getElementById('borrarTodo').addEventListener('click', () => {
    if (confirm('¿Borrar todos los gastos guardados? No se puede deshacer.')) {
      guardar([]);
      render();
    }
  });

  render();
</script>
</body>
</html>
